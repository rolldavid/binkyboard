name: checkPrevMigration
on:
  push:
    branches:
      - dev

jobs:
  prevMigrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18.15.0"
      - name: Run preview migration
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREV }}
          SHADOW_DATABASE_URL: ${{ secrets.DATABASE_SHADOW_PREV }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PREV }}
