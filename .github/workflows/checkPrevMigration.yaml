name: checkPrevMigration
on:
  push:
    branches:
      - dev

jobs:
  prevMigrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: "16.17.1"
      - name: Run preview migration
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREV }}
